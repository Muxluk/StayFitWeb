# SonarCloud project configuration
# https://sonarcloud.io

sonar.projectKey=Muxluk_StayFitWeb
sonar.organization=muxluk

sonar.projectName=StayFitWeb
sonar.projectVersion=1.0

# Source directory
sonar.sources=src/StayFit

# Exclusions
sonar.exclusions=\
  **/obj/**,\
  **/bin/**,\
  **/Migrations/**,\
  **/*.Designer.cs,\
  **/wwwroot/lib/**

# Test project inclusions
sonar.test.inclusions=**/StayFit.Tests/**

# Coverage report path (generated by coverlet during dotnet test)
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Encoding
sonar.sourceEncoding=UTF-8
