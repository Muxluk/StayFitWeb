name: CI Pipeline

on:
  pull_request:
    branches: ['main']
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for SonarCloud git history analysis

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # --- added for SonarCloud ---
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarCloud scanner
        run: dotnet tool install --global dotnet-sonarscanner
      # ----------------------------

      - name: Restore dependencies
        run: dotnet restore src/StayFit/StayFit.sln

      # --- added for SonarCloud ---
      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Muxluk_StayFitWeb" \
            /o:"muxluk" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.projectBaseDir="${{ github.workspace }}/src/StayFit" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/Migrations/**,**/*.Designer.cs"
      # ----------------------------
      - name: Build
        run: dotnet build src/StayFit/StayFit.sln --no-restore

      - name: Test
        run: |
          dotnet test src/StayFit/StayFit.sln --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      # --- added for SonarCloud ---
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
    # ----------------------------
