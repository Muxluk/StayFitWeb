name: CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore src/StayFit/StayFit.sln

    - name: Build
      run: dotnet build src/StayFit/StayFit.sln --no-restore -c Release

    - name: Publish
      run: dotnet publish src/StayFit/StayFit.Web/StayFit.Web.csproj -c Release -o ./publish

    - name: Create deployment package
      run: |
        cd publish
        zip -r ../deploy.zip .
        cd ..

    - name: Deploy to AWS Elastic Beanstalk
      uses: einaregilsson/beanstalk-deploy@v22
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: "StayFitWeb"
        environment_name: "StayFitWeb-env"
        version_label: "StayFit-${{ github.sha }}"
        region: "eu-north-1"
        deployment_package: "deploy.zip"
